<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Noto Sans KR",sans-serif;word-break:keep-all}
.st{position:fixed;inset:0;overflow:hidden;background:#000}
.st video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(6,6,20,.62) 0,rgba(6,6,20,.38) 45%,rgba(6,6,20,.15) 100%);opacity:0;transition:opacity 1.4s ease}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,2.6vw,34px);padding:0 24px;text-align:center;pointer-events:none}
.ov img{width:min(56vw,620px);height:auto;opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.ov .ln{overflow:hidden}
.ov p{margin:0;font-size:clamp(16px,2.1vw,30px);font-weight:500;letter-spacing:-.02em;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.7,.2,1) .55s}
.ov i{display:block;width:0;height:1px;background:rgba(255,255,255,.7);transition:width .9s ease .3s}
.st.end .scrim{opacity:1}.st.end .ov img{opacity:1;transform:none}.st.end .ov p{transform:none}.st.end .ov i{width:min(30vw,260px)}
.ai{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:18px;font-size:12px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.re{position:absolute;left:20px;bottom:14px;font:500 13px "Noto Sans KR",sans-serif;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:7px 16px;cursor:pointer}
.msg{position:absolute;left:20px;top:16px;font-size:12px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.4);padding:4px 10px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.scrim,.ov img,.ov p,.ov i{transition:none}}

.vw{position:absolute;inset:0}
.tabs{position:absolute;right:20px;top:14px;display:flex;gap:6px;z-index:5}
.tabs button{font:500 13px "Noto Sans KR",sans-serif;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button.on{background:#fff;color:#000;border-color:#fff}
.st.nr *{transition:none!important;animation:none!important}
.st.m2 .scrim,.st.m3 .scrim{display:none}
.st.m2.end .vw{animation:iris 1.7s cubic-bezier(.65,0,.3,1) forwards}
@keyframes iris{0%{clip-path:circle(80% at 50% 50%)}50%{clip-path:circle(15% at 50% 47%)}72%{clip-path:circle(15% at 50% 47%)}100%{clip-path:circle(0% at 50% 47%)}}
.st.m2.end .ov img{transition-delay:1.75s}.st.m2.end .ov i{transition-delay:2.05s}.st.m2.end .ov p{transition-delay:2.3s}
.st.m3.end .vw{visibility:hidden}
.st.m3.end .ov img{transition:none;opacity:0;animation:snap .5s cubic-bezier(.2,.8,.2,1) .45s forwards}
@keyframes snap{0%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
.st.m3.end .ov i{transition-delay:.85s}.st.m3.end .ov p{transition-delay:1.1s}
@media (max-width:600px){.tabs{left:12px;right:12px;top:10px;justify-content:center}.tabs button{padding:6px 10px;font-size:12px}}
</style></head><body>
